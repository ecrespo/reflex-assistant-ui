[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-assistant-ui"
version = "0.1.0"
description = "assistant-ui chat components for Reflex: streaming threads, markdown, tool calls, branching and multi-conversation, all driven from Python state."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "reflex-custom-components",
    "assistant-ui",
    "chat",
    "llm",
    "ai",
    "ollama",
    "streaming",
]

dependencies = ["reflex>=0.9.11", "httpx>=0.27"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-assistant-ui"
Repository = "https://github.com/ecrespo/reflex-assistant-ui"
Issues = "https://github.com/ecrespo/reflex-assistant-ui/issues"
"assistant-ui" = "https://www.assistant-ui.com/"

[project.optional-dependencies]
dev = ["build", "twine", "ruff", "pytest>=8"]
# Dependencies of the demo app in assistant_ui_demo/ (not needed by the package).
demo = ["langchain-core>=1.0", "langchain-ollama>=1.0"]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
"reflex_assistant_ui" = ["*.pyi", "*.jsx", "*.css", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
